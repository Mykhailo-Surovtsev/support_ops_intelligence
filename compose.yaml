services:
  api:
    build: .
    image: support-ops-intelligence:0.1.0
    container_name: support-ops-api
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-demo}
      API_SHARED_SECRET: ${API_SHARED_SECRET:-}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_API_KEY: ${CRM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.9
    container_name: n8n-local
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # Keep workflow expressions isolated from container secrets. For a protected
      # API, configure an n8n HTTP Header Auth credential after importing the flow.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      GENERIC_TIMEZONE: Europe/Warsaw
      TZ: Europe/Warsaw
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data: