services:
  api:
    build: .
    image: support-ops-intelligence:0.1.0
    container_name: support-ops-api
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/app/data
    environment:
      API_SHARED_SECRET: ${API_SHARED_SECRET:-}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_API_KEY: ${CRM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.9
    container_name: n8n-local
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      # The imported workflow reads only API_SHARED_SECRET to authenticate to the
      # internal FastAPI service. n8n 2.x blocks $env expressions unless this
      # is explicitly enabled.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Europe/Warsaw
      TZ: Europe/Warsaw
      API_SHARED_SECRET: ${API_SHARED_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
